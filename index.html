<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>유니테스트 통합 관제 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        .active-nav { color: #1d4ed8 !important; border-top: 3px solid #1d4ed8; }
        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

    <header class="bg-white shadow-sm sticky top-0 z-[60]">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-black text-blue-700 flex items-center">
                <i class="fa-solid fa-layer-group mr-2"></i>UNI-CONTROL
            </h1>
            <div id="header-status" class="text-[10px] font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded border border-blue-100">실시간 연결됨</div>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full p-4">

        <div id="screen-list" class="screen active space-y-5">
            <div class="flex justify-between items-end">
                <div>
                    <h2 class="text-xl font-extrabold text-slate-800">진행중 경조사</h2>
                    <p class="text-[11px] text-slate-500 font-medium">현재 대응 중인 비상상황 목록입니다.</p>
                </div>
                <button onclick="openModal()" class="bg-blue-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-lg shadow-blue-200">
                    <i class="fa-solid fa-plus mr-1"></i>상황 등록
                </button>
            </div>
            <div id="eventListArea" class="space-y-4"></div>
            
            <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 mt-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-slate-700 text-sm flex items-center"><i class="fa-solid fa-phone-volume text-blue-500 mr-2"></i>공통 협력업체</h2>
                    <button onclick="addVendor()" class="text-[10px] bg-slate-100 text-slate-600 px-2 py-1 rounded font-bold">+ 추가</button>
                </div>
                <div id="vendorList" class="space-y-3"></div>
            </section>
        </div>

        <div id="screen-history" class="screen space-y-5">
            <div>
                <h2 class="text-xl font-extrabold text-slate-800">경조사 이력 조회</h2>
                <p class="text-[11px] text-slate-500 font-medium">종료된 과거의 경조사 대응 기록입니다.</p>
            </div>
            <div id="historyListArea" class="space-y-3"></div>
        </div>

        <div id="screen-detail" class="screen space-y-6">
            <div class="flex items-center gap-3">
                <button onclick="switchScreen('screen-list')" class="w-9 h-9 flex items-center justify-center bg-white border border-slate-200 rounded-xl shadow-sm"><i class="fa-solid fa-chevron-left text-slate-600"></i></button>
                <div class="flex-grow">
                    <h2 id="d_title" class="text-lg font-extrabold text-slate-800 leading-tight"></h2>
                    <p id="d_info" class="text-[10px] text-blue-600 font-bold mt-1 bg-blue-50 inline-block px-2 py-0.5 rounded"></p>
                </div>
                <button id="btn-close-event" onclick="closeEvent()" class="text-[10px] bg-red-600 text-white px-3 py-2 rounded-lg font-bold shadow-md shadow-red-100">종료</button>
            </div>

            <section class="bg-gradient-to-br from-blue-600 to-blue-800 rounded-3xl p-5 shadow-xl text-white">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-sm opacity-90">종합 진행률</h2>
                    <span id="globalPercent" class="text-3xl font-black italic">0%</span>
                </div>
                <div class="w-full bg-blue-900/40 h-2.5 rounded-full overflow-hidden mb-5">
                    <div id="globalProgressBar" class="bg-white h-full transition-all duration-700 ease-out" style="width: 0%"></div>
                </div>
                <div class="grid grid-cols-4 gap-2 text-center text-[10px]" id="memberProgress"></div>
            </section>

            <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                <h2 class="font-bold text-slate-700 text-sm mb-3"><i class="fa-solid fa-calculator text-blue-500 mr-2"></i>경조 규정 자동 계산기</h2>
                <select id="eventSelect" onchange="calculateCondolence()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-xl p-3 focus:outline-none focus:border-blue-500">
                    <option value="">종류를 선택하면 규정이 출력됩니다.</option>
                    <option value="parent_death">부모님 상 (빙부/빙모 포함)</option>
                    <option value="sibling_death">형제자매 상 (본인/배우자)</option>
                    <option value="aunt_uncle_death">고모/삼촌 (부모님 형제자매 상)</option>
                    <option value="grandparent_death">조부모 상 (외/빙조부모 포함)</option>
                    <option value="sibling_marriage">형제자매 결혼 (본인/배우자)</option>
                    <option value="my_marriage">본인 결혼</option>
                </select>
                <div id="calcResult" class="hidden bg-blue-50 p-4 rounded-xl border border-blue-100 text-[11px] space-y-2 mt-2">
                    <div class="flex justify-between"><span class="text-slate-500">회사 경조금</span><span id="r_company" class="font-bold text-blue-700"></span></div>
                    <div class="flex justify-between"><span class="text-slate-500">사우회비</span><span id="r_mutual" class="font-bold text-blue-700"></span></div>
                    <div class="flex justify-between"><span class="text-slate-500">지원 휴가</span><span id="r_leave" class="font-bold text-slate-700"></span></div>
                    <div class="flex justify-between"><span class="text-slate-500">화환/조화</span><span id="r_flower" class="font-bold text-slate-700"></span></div>
                </div>
            </section>

            <div id="ownerCardsArea" class="space-y-4 pb-10"></div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-[100] pb-safe">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <button onclick="switchScreen('screen-list')" id="nav-screen-list" class="flex flex-col items-center gap-1 text-slate-400 transition-all active-nav">
                <i class="fa-solid fa-house-chimney text-xl"></i>
                <span class="text-[10px] font-bold">진행 상황</span>
            </button>
            <button onclick="switchScreen('screen-history')" id="nav-screen-history" class="flex flex-col items-center gap-1 text-slate-400 transition-all">
                <i class="fa-solid fa-clock-rotate-left text-xl"></i>
                <span class="text-[10px] font-bold">이력 조회</span>
            </button>
            <button onclick="alert('사무용품/차량관리 기능은 준비중입니다.')" class="flex flex-col items-center gap-1 text-slate-300">
                <i class="fa-solid fa-briefcase text-xl"></i>
                <span class="text-[10px] font-bold">기타 업무</span>
            </button>
        </div>
    </nav>

    <div id="registerModal" class="fixed inset-0 bg-slate-900/70 z-[200] hidden flex items-center justify-center p-5">
        <div class="bg-white rounded-3xl w-full max-w-sm shadow-2xl overflow-hidden animate-slide-up">
            <div class="bg-blue-600 px-6 py-5 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">새 경조사 상황 등록</h3>
                <button onclick="closeModal()"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">상황명</label>
                    <input type="text" id="reg_title" placeholder="예: 경영지원팀 홍길동 프로 부친상" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 bg-slate-50">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">일시 (발인/예식 등)</label>
                    <input type="datetime-local" id="reg_time" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 bg-slate-50">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">장소</label>
                    <input type="text" id="reg_location" placeholder="예: 평촌 한림대 장례식장 1호실" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 bg-slate-50">
                </div>
                <button onclick="submitEvent()" class="w-full bg-blue-600 text-white font-bold rounded-2xl py-4 mt-2 shadow-lg shadow-blue-100 hover:bg-blue-700">관제 시작</button>
            </div>
        </div>
    </div>

    <script>
        // ★ 본인의 Firebase Config 로 덮어쓰세요
        const firebaseConfig = {
            apiKey: "AIzaSyBqu8g0wPkRDG4zrNz/CDSrZZjbuSWlkc4",
            authDomain: "msd-weekend.firebaseapp.com",
            projectId: "msd-weekend",
            storageBucket: "msd-weekend.firebasestorage.app",
            messagingSenderId: "167933737161",
            appId: "1:167933737161:web:3df42c755f658e19323518"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentEventId = null;
        let isReadOnly = false; 
        const owners = ['조정열', '안정훈/변우혁', '김태석', '박유희'];
        let activeTasksUnsubscribe = null; 
        let activeMetaUnsubscribe = null;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
            const navBtn = document.getElementById('nav-' + screenId);
            if(navBtn) navBtn.classList.add('active-nav');
            
            if(screenId === 'screen-list' || screenId === 'screen-history') {
                currentEventId = null;
                if(activeTasksUnsubscribe) activeTasksUnsubscribe();
                if(activeMetaUnsubscribe) activeMetaUnsubscribe();
            }
        }

        function loadLists() {
            db.collection("events").where("status", "==", "active").orderBy("createdAt", "desc").onSnapshot(snap => {
                let html = '';
                snap.forEach(doc => {
                    const e = doc.data();
                    html += `<div onclick="openDetail('${doc.id}', '${e.title}', '${e.time} | ${e.location}', false)" class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 cursor-pointer hover:border-blue-300 relative transition-all group active:scale-[0.98]">
                        <div class="absolute top-0 left-6 w-8 h-1.5 bg-blue-500 rounded-b-full"></div>
                        <h3 class="font-black text-slate-800 mb-2">${e.title}</h3>
                        <div class="flex items-center gap-3 text-[10px] text-slate-400 font-bold">
                            <span><i class="fa-solid fa-calendar-day mr-1 text-blue-400"></i>${e.time}</span>
                            <span><i class="fa-solid fa-location-dot mr-1 text-blue-400"></i>${e.location}</span>
                        </div>
                    </div>`;
                });
                document.getElementById('eventListArea').innerHTML = html || '<div class="py-10 text-center text-slate-300 text-xs font-bold italic">진행중인 비상상황이 없습니다.</div>';
            });

            db.collection("events").where("status", "==", "closed").orderBy("createdAt", "desc").onSnapshot(snap => {
                let html = '';
                snap.forEach(doc => {
                    const e = doc.data();
                    const dateStr = new Date(e.createdAt).toLocaleDateString();
                    html += `<div onclick="openDetail('${doc.id}', '${e.title}', '${e.time}', true)" class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center active:bg-slate-50 mt-3">
                        <div>
                            <p class="text-[9px] font-black text-slate-400 uppercase mb-0.5">${dateStr} 종료됨</p>
                            <h4 class="font-bold text-sm text-slate-700">${e.title}</h4>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                    </div>`;
                });
                document.getElementById('historyListArea').innerHTML = html || '<div class="py-10 text-center text-slate-300 text-xs">종료된 이력이 없습니다.</div>';
            });
        }

        function openDetail(eventId, title, info, readOnly) {
            currentEventId = eventId;
            isReadOnly = readOnly;
            
            document.getElementById('d_title').innerText = title;
            document.getElementById('d_info').innerText = info;
            document.getElementById('btn-close-event').style.display = readOnly ? 'none' : 'block';
            
            switchScreen('screen-detail');
            listenToTasks(eventId);
        }

        function listenToTasks(eventId) {
            if(activeTasksUnsubscribe) activeTasksUnsubscribe();
            if(activeMetaUnsubscribe) activeMetaUnsubscribe();

            activeTasksUnsubscribe = db.collection("tasks").where("eventId", "==", eventId).onSnapshot(snap => {
                let allTasks = [];
                snap.forEach(doc => allTasks.push({ id: doc.id, ...doc.data() }));
                allTasks.sort((a,b) => a.createdAt - b.createdAt);
                
                db.collection("eventMeta").where("eventId", "==", eventId).get().then(mSnap => {
                    let allMeta = {};
                    mSnap.forEach(mDoc => allMeta[mDoc.data().owner] = mDoc.data());
                    renderBoard(allTasks, allMeta);
                });
            });
        }

        function renderBoard(tasks, meta) {
            let total = 0, done = 0;
            let mHtml = '', cHtml = '';

            owners.forEach(owner => {
                const myTasks = tasks.filter(t => t.owner === owner);
                const myMeta = meta[owner] || { sub: '', note: '' };
                total += myTasks.length;
                done += myTasks.filter(t => t.done).length;

                const isAllDone = (myTasks.length > 0 && myTasks.length === myTasks.filter(t => t.done).length);
                mHtml += `<div class="bg-blue-900/30 rounded-xl py-2 border border-blue-400/20">
                    <div class="font-black ${isAllDone ? 'text-green-300' : 'text-blue-100'}">${owner.includes('안정훈') ? '안/변' : owner}</div>
                    <div class="opacity-80">${myTasks.filter(t => t.done).length}/${myTasks.length}</div>
                </div>`;

                let taskHtml = myTasks.map(t => `<div class="flex items-start gap-3 py-2.5 border-b border-slate-50 last:border-0" ${!isReadOnly ? `onclick="toggleTask('${t.id}', ${!t.done})"` : ''}>
                    <div class="w-5 h-5 rounded flex-shrink-0 border-2 flex items-center justify-center transition-all ${t.done ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-200'}">
                        ${t.done ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                    </div>
                    <span class="text-sm ${t.done ? 'text-slate-300 line-through' : 'text-slate-600 font-medium'}">${t.title}</span>
                </div>`).join('');

                cHtml += `<div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden mb-4">
                    <div class="bg-slate-50/80 px-5 py-3 flex justify-between items-center">
                        <span class="text-xs font-black text-slate-800">${myMeta.sub ? `${owner} <span class="text-blue-500">(${myMeta.sub} 대체)</span>` : owner}</span>
                        ${!isReadOnly ? `<button onclick="setSub('${owner}')" class="text-[9px] font-bold text-blue-600 border border-blue-200 bg-white px-2 py-1 rounded-lg">대체자</button>` : ''}
                    </div>
                    <div class="p-5">${taskHtml || '<p class="text-xs text-slate-300 italic">No tasks</p>'}</div>
                    <div class="p-4 bg-yellow-50/50 border-t border-yellow-100 flex gap-2">
                        <input type="text" id="note_${owner}" value="${myMeta.note || ''}" ${isReadOnly ? 'disabled' : ''} placeholder="특이사항..." class="text-xs w-full bg-white border border-yellow-200 rounded-xl px-3 py-2 outline-none focus:border-yellow-400">
                        ${!isReadOnly ? `<button onclick="saveNote('${owner}')" class="bg-yellow-400 text-yellow-900 font-black px-4 py-2 rounded-xl text-xs">저장</button>` : ''}
                    </div>
                </div>`;
            });

            document.getElementById('memberProgress').innerHTML = mHtml;
            document.getElementById('ownerCardsArea').innerHTML = cHtml;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            document.getElementById('globalPercent').innerText = per + '%';
            document.getElementById('globalProgressBar').style.width = per + '%';
        }

        window.toggleTask = (id, status) => { if(isReadOnly) return; db.collection("tasks").doc(id).update({ done: status }); };
        window.setSub = (owner) => { const s = prompt("대체자 성함:"); if(s !== null) db.collection("eventMeta").where("eventId", "==", currentEventId).where("owner", "==", owner).get().then(snap => { if(snap.empty) db.collection("eventMeta").add({ eventId: currentEventId, owner, sub: s }); else snap.forEach(d => d.ref.update({ sub: s })); }); };
        window.saveNote = (owner) => { const n = document.getElementById('note_'+owner).value; db.collection("eventMeta").where("eventId", "==", currentEventId).where("owner", "==", owner).get().then(snap => { if(snap.empty) db.collection("eventMeta").add({ eventId: currentEventId, owner, note: n }); else snap.forEach(d => d.ref.update({ note: n })); alert('저장됨'); }); };
        
        // ★ 날짜 선택 로직 변경 (달력 UI)
        function submitEvent() {
            const t = document.getElementById('reg_title').value;
            const tmRaw = document.getElementById('reg_time').value;
            const l = document.getElementById('reg_location').value;
            
            if(!t) return alert("제목을 입력해주세요.");
            if(!tmRaw) return alert("일시를 선택해주세요.");

            // 사용자가 선택한 날짜/시간을 예쁘게 변환 (예: 5/15(금) 08:00)
            const dDate = new Date(tmRaw);
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const formattedTime = `${dDate.getMonth()+1}/${dDate.getDate()}(${days[dDate.getDay()]}) ${dDate.getHours().toString().padStart(2,'0')}:${dDate.getMinutes().toString().padStart(2,'0')}`;

            db.collection("events").add({ title: t, time: formattedTime, location: l, status: 'active', createdAt: Date.now() }).then(doc => {
                const def = [{o:'조정열',t:'단톡방 지원조건 공유'},{o:'안정훈/변우혁',t:'사우회비 전달/확인'},{o:'안정훈/변우혁',t:'지출결의서 준비'},{o:'김태석',t:'비상연락망 가동'},{o:'김태석',t:'대절버스 수요파악'},{o:'박유희',t:'업체 발주 완료'}];
                def.forEach((d, i) => db.collection("tasks").add({ eventId: doc.id, owner: d.o, title: d.t, done: false, createdAt: Date.now() + i }));
                closeModal(); 
                
                // 입력 필드 초기화
                document.getElementById('reg_title').value = '';
                document.getElementById('reg_time').value = '';
                document.getElementById('reg_location').value = '';
                
                openDetail(doc.id, t, formattedTime, false);
            });
        }

        window.closeEvent = () => { if(confirm("종료하시겠습니까? 이력조회 메뉴로 이동합니다.")) db.collection("events").doc(currentEventId).update({ status: 'closed' }).then(() => switchScreen('screen-history')); };
        function closeModal() { document.getElementById('registerModal').classList.add('hidden'); }
        function openModal() { document.getElementById('registerModal').classList.remove('hidden'); }
        
        const rules = {
            parent_death: { c: '500,000원', m: '500,000원', l: '7일', f: '지원' },
            sibling_death: { c: '300,000원', m: '300,000원', l: '3일', f: '-' },
            aunt_uncle_death: { c: '-', m: '200,000원', l: '-', f: '-' },
            grandparent_death: { c: '300,000원', m: '300,000원', l: '3일', f: '지원' },
            sibling_marriage: { c: '100,000원', m: '200,000원', l: '1일', f: '-' },
            my_marriage: { c: '500,000원', m: '700,000원', l: '7일', f: '지원' }
        };
        window.calculateCondolence = () => {
            const v = document.getElementById('eventSelect').value;
            const res = document.getElementById('calcResult');
            if(!v) return res.classList.add('hidden');
            document.getElementById('r_company').innerText = rules[v].c;
            document.getElementById('r_mutual').innerText = rules[v].m;
            document.getElementById('r_leave').innerText = rules[v].l;
            document.getElementById('r_flower').innerText = rules[v].f;
            res.classList.remove('hidden');
        };

        // 업체 데이터
        db.collection("vendors").onSnapshot(snap => {
            let html = '';
            snap.forEach(doc => {
                const v = doc.data();
                html += `
                    <div class="flex justify-between items-center p-3 bg-slate-50 border border-slate-200 rounded-xl">
                        <div>
                            <p class="font-bold text-sm">${v.name}</p>
                            <p class="text-xs text-slate-500">${v.tel}</p>
                        </div>
                        <div class="flex gap-2">
                            <a href="tel:${v.tel}" class="w-8 h-8 flex items-center justify-center bg-blue-100 text-blue-600 rounded-full"><i class="fa-solid fa-phone"></i></a>
                            <button onclick="delVendor('${doc.id}')" class="w-8 h-8 flex items-center justify-center bg-red-50 text-red-500 rounded-full"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>`;
            });
            document.getElementById('vendorList').innerHTML = html || '<p class="text-xs text-slate-400">등록된 업체가 없습니다.</p>';
        });
        window.addVendor = () => { const n = prompt("업체명"); if(!n) return; const t = prompt("전화번호"); if(!t) return; db.collection("vendors").add({ name: n, tel: t }); };
        window.delVendor = (id) => confirm("업체 삭제?") && db.collection("vendors").doc(id).delete();

        // 초기 실행
        loadLists();
    </script>
</body>
</html>
