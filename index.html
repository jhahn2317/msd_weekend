<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주말 업무 대응 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        .active-nav { color: #1d4ed8 !important; border-top: 3px solid #1d4ed8; }
        .screen { display: none; }
        .screen.active { display: block; }
        .tab-active { color: #2563eb !important; border-bottom: 2px solid #2563eb !important; }
        .toggle-checkbox:checked { right: 0; border-color: #2563eb; }
        .toggle-checkbox:checked + .toggle-label { background-color: #2563eb; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { background-color: #cbd5e1; transition: all 0.3s; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <header class="bg-white shadow-sm sticky top-0 z-[60]">
        <div class="max-w-md mx-auto px-3 py-2 flex justify-between items-center">
            <h1 class="text-[12px] sm:text-sm font-black text-blue-700 flex items-center">
                <i class="fa-solid fa-square-poll-vertical mr-1.5"></i>유니테스트 경영지원팀 주말 업무 대응
            </h1>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full p-3">

        <div id="screen-list" class="screen active space-y-4">
            <div class="flex justify-between items-end mb-1">
                <div>
                    <h2 class="text-lg font-extrabold text-slate-800">진행중 경조사</h2>
                    <p class="text-[10px] text-slate-500">현재 관리 중인 비상상황 리스트입니다.</p>
                </div>
                <button onclick="openModal('registerModal')" class="bg-blue-600 text-white text-[11px] font-bold px-3 py-2 rounded-lg shadow-md">
                    + 상황 등록
                </button>
            </div>
            <div id="eventListArea"><div class="py-8 text-center text-slate-400 text-[11px] italic font-medium">데이터를 불러오는 중입니다...</div></div>
            
            <section class="bg-white rounded-xl p-3 shadow-sm border border-slate-200 mt-6">
                <div class="flex justify-between items-center mb-2.5">
                    <h2 class="font-bold text-slate-700 text-xs flex items-center"><i class="fa-solid fa-address-book text-blue-500 mr-1.5"></i>협력업체 연락처</h2>
                    <button onclick="openVendorModal()" class="text-[9px] bg-slate-100 text-slate-600 px-2 py-1 rounded font-bold hover:bg-slate-200 transition">+ 새 업체 등록</button>
                </div>
                <div id="vendorList_home" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
            </section>
        </div>

        <div id="screen-history" class="screen space-y-4">
            <div>
                <h2 class="text-lg font-extrabold text-slate-800">대응 이력 조회</h2>
                <p class="text-[10px] text-slate-500">종료 처리된 과거 기록입니다.</p>
            </div>
            <div id="historyListArea"></div>
        </div>

        <div id="screen-detail" class="screen space-y-3">
            <div class="flex items-center gap-2">
                <button onclick="switchScreen('screen-list')" class="w-8 h-8 flex items-center justify-center bg-white border border-slate-200 rounded-lg"><i class="fa-solid fa-chevron-left text-slate-600 text-xs"></i></button>
                <div class="flex-grow">
                    <h2 id="d_title" class="text-sm font-extrabold text-slate-800 leading-tight"></h2>
                    <p id="d_info" class="text-[9px] text-blue-600 font-bold mt-0.5 bg-blue-50 inline-block px-1.5 py-0.5 rounded"></p>
                </div>
                <button id="btn-close-event" onclick="closeEvent()" class="text-[10px] bg-red-600 text-white px-2 py-1.5 rounded-md font-bold">종료</button>
            </div>

            <section class="bg-gradient-to-br from-blue-600 to-blue-800 rounded-xl p-3 shadow-md text-white">
                <div class="flex justify-between items-center mb-1.5">
                    <h2 class="font-bold text-[10px] opacity-90 text-blue-100">TOTAL PROGRESS</h2>
                    <span id="globalPercent" class="text-xl font-black italic">0%</span>
                </div>
                <div class="w-full bg-blue-900/40 h-2 rounded-full overflow-hidden mb-2.5">
                    <div id="globalProgressBar" class="bg-white h-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <div class="grid grid-cols-4 gap-1 text-center text-[9px]" id="memberProgress"></div>
            </section>

            <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="flex border-b border-slate-100 bg-slate-50">
                    <button id="tab-btn-rule" onclick="switchTab('rule')" class="w-1/2 py-2 text-[11px] font-bold text-slate-400 border-b-2 border-transparent tab-active"><i class="fa-solid fa-calculator mr-1"></i>규정 확인</button>
                    <button id="tab-btn-vendor" onclick="switchTab('vendor')" class="w-1/2 py-2 text-[11px] font-bold text-slate-400 border-b-2 border-transparent"><i class="fa-solid fa-address-book mr-1"></i>업체 연락처</button>
                </div>

                <div id="tab-rule" class="p-3">
                    <select id="eventSelect" onchange="calculateCondolence()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-[11px] rounded-lg p-2 focus:outline-none">
                        <option value="">경조 종류를 선택하세요</option>
                        <option value="parent_death">부모님 상 (빙부/빙모 포함)</option>
                        <option value="sibling_death">형제자매 상 (본인/배우자)</option>
                        <option value="aunt_uncle_death">고모/삼촌 (부모님 형제자매 상)</option>
                        <option value="grandparent_death">조부모 상 (외/빙조부모 포함)</option>
                        <option value="sibling_marriage">형제자매 결혼 (본인/배우자)</option>
                        <option value="my_marriage">본인 결혼</option>
                    </select>
                    <div id="calcResult" class="hidden bg-blue-50 p-2 rounded-lg border border-blue-100 text-[10px] space-y-1 mt-2 font-medium">
                        <div class="flex justify-between"><span>회사 경조금</span><span id="r_company" class="font-bold text-blue-700"></span></div>
                        <div class="flex justify-between"><span>사우회비</span><span id="r_mutual" class="font-bold text-blue-700"></span></div>
                        <div class="flex justify-between"><span>지원 휴가</span><span id="r_leave" class="font-bold text-slate-700"></span></div>
                        <div class="flex justify-between"><span>화환/조화</span><span id="r_flower" class="font-bold text-slate-700"></span></div>
                    </div>
                </div>

                <div id="tab-vendor" class="p-3 hidden">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold text-slate-500">긴급 협력업체 리스트</span>
                        <button onclick="openVendorModal()" class="text-[9px] bg-blue-50 text-blue-600 px-2 py-1 rounded font-bold border border-blue-100">+ 새 업체 등록</button>
                    </div>
                    <div id="vendorList_detail" class="space-y-1.5 max-h-48 overflow-y-auto pr-1"></div>
                </div>
            </section>

            <div>
                <p class="text-[9px] text-slate-400 font-bold mb-1.5 px-1"><i class="fa-solid fa-circle-info mr-1"></i>업무 텍스트를 길게 꾹 누르면 수정/삭제할 수 있습니다.</p>
                <div id="ownerCardsArea" class="space-y-3 pb-6"></div>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-[100] h-14">
        <div class="max-w-md mx-auto flex justify-around items-center h-full">
            <button onclick="switchScreen('screen-list')" id="nav-screen-list" class="flex flex-col items-center gap-0.5 text-slate-400 active-nav w-1/3">
                <i class="fa-solid fa-house text-lg"></i><span class="text-[9px] font-bold">진행 상황</span>
            </button>
            <button onclick="switchScreen('screen-history')" id="nav-screen-history" class="flex flex-col items-center gap-0.5 text-slate-400 w-1/3">
                <i class="fa-solid fa-clock-rotate-left text-lg"></i><span class="text-[9px] font-bold">이력 조회</span>
            </button>
            <button onclick="alert('준비 중입니다.')" class="flex flex-col items-center gap-0.5 text-slate-300 w-1/3">
                <i class="fa-solid fa-ellipsis text-lg"></i><span class="text-[9px] font-bold">기타 업무</span>
            </button>
        </div>
    </nav>

    <div id="registerModal" class="fixed inset-0 bg-slate-900/60 z-[200] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
            <div class="bg-blue-600 px-4 py-3 text-white flex justify-between items-center">
                <h3 class="font-bold text-sm">새 경조사 등록</h3>
                <button onclick="closeModal('registerModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 space-y-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">상황명</label><input type="text" id="reg_title" placeholder="예: 홍길동 프로 부친상" class="w-full border border-slate-200 rounded-lg p-2 text-xs focus:outline-none focus:border-blue-500 bg-slate-50"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">일시 (자유입력)</label><input type="text" id="reg_time" placeholder="예: 5/15(금) / 발인 08:00" class="w-full border border-slate-200 rounded-lg p-2 text-xs focus:outline-none focus:border-blue-500 bg-slate-50"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">장소</label><input type="text" id="reg_location" placeholder="예: 강남 성모병원 1호실" class="w-full border border-slate-200 rounded-lg p-2 text-xs focus:outline-none focus:border-blue-500 bg-slate-50"></div>
                <button onclick="submitEvent()" class="w-full bg-blue-600 text-white font-bold rounded-lg py-2.5 mt-1 text-xs shadow-md">관제 시작 (방 생성)</button>
            </div>
        </div>
    </div>

    <div id="taskEditModal" class="fixed inset-0 bg-slate-900/60 z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-xs overflow-hidden shadow-2xl">
            <div class="bg-slate-100 px-4 py-3 flex justify-between items-center border-b border-slate-200">
                <h3 class="font-bold text-xs text-slate-700">개인 업무 관리</h3>
                <button onclick="closeModal('taskEditModal')"><i class="fa-solid fa-xmark text-slate-500"></i></button>
            </div>
            <div class="p-4 space-y-3">
                <label class="block text-[10px] font-bold text-slate-400 mb-1">업무 내용</label>
                <textarea id="edit_task_title" rows="3" class="w-full border border-slate-200 rounded-lg p-2 text-[11px] focus:outline-none focus:border-blue-500 bg-slate-50 resize-none"></textarea>
                <div class="flex gap-2 pt-2">
                    <button onclick="deleteEditedTask()" class="w-1/3 bg-red-50 text-red-600 font-bold border border-red-100 rounded-lg py-2 text-xs hover:bg-red-100">삭제</button>
                    <button onclick="saveEditedTask()" class="w-2/3 bg-blue-600 text-white font-bold rounded-lg py-2 text-xs hover:bg-blue-700">수정 내용 저장</button>
                </div>
            </div>
        </div>
    </div>

    <div id="vendorModal" class="fixed inset-0 bg-slate-900/60 z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
            <div class="bg-slate-800 px-4 py-3 text-white flex justify-between items-center">
                <h3 id="vendorModalTitle" class="font-bold text-sm">업체 정보 관리</h3>
                <button onclick="closeModal('vendorModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 space-y-3 max-h-[70vh] overflow-y-auto">
                <input type="hidden" id="v_id">
                
                <div class="flex gap-2">
                    <div class="w-1/2">
                        <label class="block text-[10px] font-bold text-slate-500 mb-1">업체명</label>
                        <input type="text" id="v_name" class="w-full border border-slate-200 rounded-lg p-2 text-xs bg-slate-50 outline-none focus:border-blue-500">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-[10px] font-bold text-slate-500 mb-1">전화번호</label>
                        <input type="text" id="v_tel" class="w-full border border-slate-200 rounded-lg p-2 text-xs bg-slate-50 outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 mb-1">업무 내용 (분류)</label>
                    <input type="text" id="v_desc" class="w-full border border-slate-200 rounded-lg p-2 text-xs bg-slate-50 outline-none focus:border-blue-500">
                </div>

                <div class="flex justify-between items-center py-1 border-t border-b border-slate-100 mt-2">
                    <span class="text-[11px] font-bold text-slate-700">전화 걸기 버튼 사용</span>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" id="v_use_call" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="v_use_call" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                </div>

                <div class="flex justify-between items-center py-1 border-b border-slate-100">
                    <span class="text-[11px] font-bold text-slate-700">문자 발송 버튼 사용</span>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" id="v_use_sms" onchange="toggleSmsArea()" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="v_use_sms" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                </div>

                <div id="smsTemplateArea" class="hidden">
                    <div class="flex justify-between items-end mb-1 mt-2">
                        <label class="block text-[10px] font-bold text-slate-500">문자 양식 (위드고/우영/범아 고정)</label>
                        <span class="text-[8px] text-blue-500 font-bold bg-blue-50 px-1 rounded">자동변환: [일시], [장소], [행사명]</span>
                    </div>
                    <textarea id="v_sms_template" rows="5" class="w-full border border-slate-200 rounded-lg p-2 text-[10px] bg-slate-50 outline-none focus:border-blue-500 leading-relaxed"></textarea>
                </div>

                <div class="flex gap-2 pt-2 mt-4">
                    <button id="btn_delete_vendor" onclick="deleteVendor()" class="w-1/3 bg-red-50 text-red-600 font-bold border border-red-100 rounded-lg py-2.5 text-xs hover:bg-red-100 hidden">업체 삭제</button>
                    <button onclick="saveVendor()" class="flex-grow bg-slate-800 text-white font-bold rounded-lg py-2.5 text-xs hover:bg-slate-900">저장</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ★ [핵심] 오타가 수정된 100% 정확한 진짜 파이어베이스 키값 적용 ★
        const firebaseConfig = {
            apiKey: "AIzaSyBqu8g0wPkRDG4zrNz/CDSrZZjbuSWlkc4", // 오타 수정 완료
            authDomain: "msd-weekend.firebaseapp.com",
            projectId: "msd-weekend",
            storageBucket: "msd-weekend.firebasestorage.app",
            messagingSenderId: "167933737161",
            appId: "1:167933737161:web:3df42c755f658e19323518"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentEventId = null;
        let isReadOnly = false; 
        const owners = ['조정열', '안정훈/변우혁', '김태석', '박유희'];
        let activeTasksUnsubscribe = null; 
        let activeMetaUnsubscribe = null;
        let vendorDataCache = {};

        // [이벤트 색상 테마]
        function getEventTheme(title) {
            if (title.includes('결혼') || title.includes('혼인') || title.includes('웨딩')) {
                return { bg: 'bg-gradient-to-br from-rose-50 to-pink-50 border-pink-200', bar: 'bg-pink-400', textMain: 'text-slate-800', textSub: 'text-pink-600', icon: 'text-pink-400' };
            } else if (title.includes('상') || title.includes('사망') || title.includes('부친') || title.includes('모친') || title.includes('빙부') || title.includes('빙모') || title.includes('조부') || title.includes('조모') || title.includes('별세') || title.includes('부고')) {
                return { bg: 'bg-gradient-to-br from-slate-100 to-slate-200 border-slate-300', bar: 'bg-slate-600', textMain: 'text-slate-800', textSub: 'text-slate-600', icon: 'text-slate-500' };
            } else {
                return { bg: 'bg-gradient-to-br from-blue-50 to-indigo-50 border-blue-200', bar: 'bg-blue-500', textMain: 'text-slate-800', textSub: 'text-blue-600', icon: 'text-blue-400' };
            }
        }

        function switchTab(tabName) {
            document.getElementById('tab-rule').classList.add('hidden');
            document.getElementById('tab-vendor').classList.add('hidden');
            document.getElementById('tab-btn-rule').classList.remove('tab-active');
            document.getElementById('tab-btn-vendor').classList.remove('tab-active');
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('tab-btn-' + tabName).classList.add('tab-active');
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
            const navBtn = document.getElementById('nav-' + screenId);
            if(navBtn) navBtn.classList.add('active-nav');
            if(screenId === 'screen-list' || screenId === 'screen-history') {
                currentEventId = null;
                if(activeTasksUnsubscribe) activeTasksUnsubscribe();
                if(activeMetaUnsubscribe) activeMetaUnsubscribe();
            }
        }

        // [데이터 로드 - 에러 핸들링 추가]
        function loadLists() {
            db.collection("events").where("status", "==", "active").onSnapshot(snap => {
                let events = []; snap.forEach(doc => events.push({ id: doc.id, ...doc.data() }));
                events.sort((a, b) => b.createdAt - a.createdAt);
                let html = '';
                events.forEach(e => {
                    const t = getEventTheme(e.title);
                    html += `<div class="${t.bg} p-3.5 rounded-xl shadow-sm border relative transition-all active:scale-[0.98] group mb-3">
                        <div onclick="openDetail('${e.id}', '${e.title}', '${e.time} | ${e.location}', false)" class="flex-grow cursor-pointer pr-10">
                            <div class="absolute top-0 left-4 w-6 h-1.5 ${t.bar} rounded-b-md"></div>
                            <h3 class="font-black text-[14px] ${t.textMain} mb-1 mt-1">${e.title}</h3>
                            <div class="flex items-center gap-2 text-[10px] ${t.textSub} font-bold">
                                <span><i class="fa-solid fa-calendar-day mr-1 ${t.icon}"></i>${e.time}</span>
                                <span><i class="fa-solid fa-location-dot mr-1 ${t.icon}"></i>${e.location}</span>
                            </div>
                        </div>
                        <button onclick="deleteEvent('${e.id}')" class="absolute top-4 right-3 ${t.icon} hover:text-red-500 p-2 transition-colors"><i class="fa-solid fa-trash-can text-sm"></i></button>
                    </div>`;
                });
                document.getElementById('eventListArea').innerHTML = html || '<div class="py-8 text-center text-slate-400 text-[11px] italic font-medium">현재 진행 중인 상황이 없습니다.</div>';
            }, error => {
                // DB 연결 실패 시 에러 표시
                document.getElementById('eventListArea').innerHTML = `<div class="p-4 bg-red-50 text-red-500 text-xs rounded-lg border border-red-200">데이터베이스 연결 오류입니다. 잠시 후 다시 시도해주세요.<br><br>에러 내용: ${error.message}</div>`;
            });

            db.collection("events").where("status", "==", "closed").onSnapshot(snap => {
                let events = []; snap.forEach(doc => events.push({ id: doc.id, ...doc.data() }));
                events.sort((a, b) => b.createdAt - a.createdAt);
                let html = '';
                events.forEach(e => {
                    const dateStr = new Date(e.createdAt).toLocaleDateString();
                    const t = getEventTheme(e.title);
                    html += `<div class="${t.bg} p-3 rounded-lg border flex justify-between items-center group relative mb-2">
                        <div onclick="openDetail('${e.id}', '${e.title}', '${e.time}', true)" class="flex-grow cursor-pointer">
                            <p class="text-[9px] font-bold ${t.textSub} mb-0.5">${dateStr} 종료</p>
                            <h4 class="font-bold text-xs ${t.textMain}">${e.title}</h4>
                        </div>
                        <button onclick="deleteEvent('${e.id}')" class="${t.icon} hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>`;
                });
                document.getElementById('historyListArea').innerHTML = html || '<div class="py-8 text-center text-slate-400 text-[11px]">대응 이력이 없습니다.</div>';
            });
        }

        window.deleteEvent = async (eventId) => {
            if(confirm("이 상황과 관련된 업무 내역이 모두 삭제됩니다. 계속하시겠습니까?")) {
                await db.collection("events").doc(eventId).delete();
                const taskSnap = await db.collection("tasks").where("eventId", "==", eventId).get();
                const batch = db.batch(); taskSnap.forEach(doc => batch.delete(doc.ref));
                const metaSnap = await db.collection("eventMeta").where("eventId", "==", eventId).get();
                metaSnap.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
            }
        };

        function openDetail(eventId, title, info, readOnly) {
            currentEventId = eventId; isReadOnly = readOnly;
            document.getElementById('d_title').innerText = title;
            document.getElementById('d_info').innerText = info;
            document.getElementById('btn-close-event').style.display = readOnly ? 'none' : 'block';
            switchScreen('screen-detail');
            listenToTasks(eventId);
        }

        function listenToTasks(eventId) {
            if(activeTasksUnsubscribe) activeTasksUnsubscribe();
            if(activeMetaUnsubscribe) activeMetaUnsubscribe();
            activeTasksUnsubscribe = db.collection("tasks").where("eventId", "==", eventId).onSnapshot(snap => {
                let allTasks = []; snap.forEach(doc => allTasks.push({ id: doc.id, ...doc.data() }));
                allTasks.sort((a,b) => a.createdAt - b.createdAt);
                db.collection("eventMeta").where("eventId", "==", eventId).get().then(mSnap => {
                    let allMeta = {}; mSnap.forEach(mDoc => allMeta[mDoc.data().owner] = mDoc.data());
                    renderBoard(allTasks, allMeta);
                });
            });
        }

        function renderBoard(tasks, meta) {
            let total = 0, done = 0; let mHtml = '', cHtml = '';
            owners.forEach(owner => {
                const myTasks = tasks.filter(t => t.owner === owner);
                const myMeta = meta[owner] || { sub: '', note: '' };
                total += myTasks.length; done += myTasks.filter(t => t.done).length;
                const isAllDone = (myTasks.length > 0 && myTasks.length === myTasks.filter(t => t.done).length);
                mHtml += `<div class="bg-blue-900/30 rounded-lg py-1.5 border border-blue-400/20"><div class="font-bold ${isAllDone ? 'text-green-300' : 'text-blue-100'}">${owner.includes('안정훈') ? '안/변' : owner}</div><div class="opacity-80 mt-0.5 font-bold">${myTasks.filter(t => t.done).length}/${myTasks.length}</div></div>`;
                
                let taskHtml = myTasks.map(t => `
                    <div class="flex items-start gap-2 py-1.5 border-b border-slate-50 last:border-0 relative">
                        <div onclick="toggleTask('${t.id}', ${!t.done})" class="cursor-pointer mt-0.5 w-4 h-4 rounded flex-shrink-0 border flex items-center justify-center transition-all ${t.done ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-300'}">
                            ${t.done ? '<i class="fa-solid fa-check text-[8px]"></i>' : ''}
                        </div>
                        <span oncontextmenu="event.preventDefault(); openTaskEditModal('${t.id}', '${t.title.replace(/'/g, "\\'")}');" onclick="toggleTask('${t.id}', ${!t.done})" class="cursor-pointer text-[11px] leading-snug flex-grow ${t.done ? 'text-slate-400 line-through' : 'text-slate-700 font-medium'}">
                            ${t.title}
                        </span>
                    </div>`).join('');
                
                cHtml += `<div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden"><div class="bg-slate-50 px-3 py-1.5 flex justify-between items-center border-b border-slate-100"><span class="text-[10px] font-bold text-slate-800">${myMeta.sub ? `${owner} <span class="text-blue-600">(${myMeta.sub} 대체)</span>` : owner}</span><div class="flex gap-1">${!isReadOnly ? `<button onclick="addTask('${owner}')" class="text-[8px] text-blue-600 font-bold px-1.5 py-0.5 rounded border border-blue-100 bg-white">+ 추가</button><button onclick="setSub('${owner}')" class="text-[8px] text-blue-600 font-bold px-1.5 py-0.5 rounded border border-blue-100 bg-white">대체</button>` : ''}</div></div><div class="p-3">${taskHtml || '<p class="text-[10px] text-slate-300 italic">No tasks</p>'}</div><div class="p-2 bg-yellow-50/40 border-t border-yellow-100 flex items-center gap-1.5"><input type="text" id="note_${owner}" value="${myMeta.note || ''}" ${isReadOnly ? 'disabled' : ''} placeholder="특이사항 메모..." class="text-[10px] w-full bg-white border border-yellow-200 rounded px-2 py-1.5 outline-none focus:border-yellow-400"><button onclick="saveNote('${owner}')" class="bg-yellow-400 text-yellow-900 font-bold px-3 py-1.5 rounded text-[10px] shrink-0 whitespace-nowrap">저장</button></div></div>`;
            });
            document.getElementById('memberProgress').innerHTML = mHtml;
            document.getElementById('ownerCardsArea').innerHTML = cHtml;
            const per = total === 0 ? 0 : Math.round((done / total) * 100);
            document.getElementById('globalPercent').innerText = per + '%';
            document.getElementById('globalProgressBar').style.width = per + '%';
        }

        window.toggleTask = (id, status) => { if(isReadOnly) return; db.collection("tasks").doc(id).update({ done: status }); };
        window.setSub = (owner) => { const s = prompt("대체자 성함:"); if(s !== null) db.collection("eventMeta").where("eventId", "==", currentEventId).where("owner", "==", owner).get().then(snap => { if(snap.empty) db.collection("eventMeta").add({ eventId: currentEventId, owner, sub: s }); else snap.forEach(d => d.ref.update({ sub: s })); }); };
        window.saveNote = (owner) => { const n = document.getElementById('note_'+owner).value; db.collection("eventMeta").where("eventId", "==", currentEventId).where("owner", "==", owner).get().then(snap => { if(snap.empty) db.collection("eventMeta").add({ eventId: currentEventId, owner, note: n }); else snap.forEach(d => d.ref.update({ note: n })); alert('저장 완료'); }); };

        let editTargetTaskId = null;
        window.openTaskEditModal = (id, currentTitle) => {
            if(isReadOnly) return;
            editTargetTaskId = id;
            document.getElementById('edit_task_title').value = currentTitle;
            document.getElementById('taskEditModal').classList.remove('hidden');
        };
        window.saveEditedTask = () => {
            const newTitle = document.getElementById('edit_task_title').value;
            if(!newTitle) return;
            db.collection("tasks").doc(editTargetTaskId).update({ title: newTitle });
            closeModal('taskEditModal');
        };
        window.deleteEditedTask = () => {
            if(confirm("이 업무를 삭제할까요?")) {
                db.collection("tasks").doc(editTargetTaskId).delete();
                closeModal('taskEditModal');
            }
        };
        window.addTask = (owner) => {
            if(isReadOnly) return;
            const title = prompt("추가할 업무 내용을 입력하세요.");
            if(title) db.collection("tasks").add({ eventId: currentEventId, owner, title, done: false, createdAt: Date.now() });
        };

        async function submitEvent() {
            const t = document.getElementById('reg_title').value; const tm = document.getElementById('reg_time').value; const l = document.getElementById('reg_location').value;
            if(!t) return alert("상황명을 적어주세요.");
            const doc = await db.collection("events").add({ title: t, time: tm, location: l, status: 'active', createdAt: Date.now() });
            
            const def = [
                {o:'조정열', t:'경영지원 단톡방에 경조사 지원조건 (경조금, 휴가, 조화여부 등) 공유'},
                {o:'안정훈/변우혁', t:'사우회 경조사비 직접 전달 또는 이체 확인'},
                {o:'안정훈/변우혁', t:'사우회비 전달 시 유류비/톨비 사우회 경조금 신청 상신'},
                {o:'안정훈/변우혁', t:'[월요일] 지출결의서 상신 (금액 확인)'},
                {o:'김태석', t:'휴일 비상연락망(카톡) 가동하여 상황 전파'},
                {o:'김태석', t:'유니넷 경조사 게시판에 게시'},
                {o:'김태석', t:'대상자에게 대절버스 필요 여부 확인 (가능 거리 시)'},
                {o:'김태석', t:'[버스 필요시] 카톡 공지 추가 및 인원파악 글 게시'},
                {o:'박유희', t:'화환/조화 발송 업체 예약 완료'},
                {o:'박유희', t:'배송지 도착 여부 최종 확인'}
            ];
            const promises = def.map((d, i) => db.collection("tasks").add({ eventId: doc.id, owner: d.o, title: d.t, done: false, createdAt: Date.now() + i }));
            await Promise.all(promises);
            closeModal('registerModal'); document.getElementById('reg_title').value = ''; document.getElementById('reg_time').value = ''; document.getElementById('reg_location').value = '';
            openDetail(doc.id, t, (tm||'')+' | '+(l||''), false);
        }

        window.closeEvent = () => { if(confirm("종료 후 이력으로 이동하시겠습니까?")) db.collection("events").doc(currentEventId).update({ status: 'closed' }).then(() => switchScreen('screen-history')); };
        function closeModal(modalId) { document.getElementById(modalId).classList.add('hidden'); }
        function openModal(modalId) { document.getElementById(modalId).classList.remove('hidden'); }

        const rules = { parent_death: { c: '500,000원', m: '500,000원', l: '7일', f: '지원' }, sibling_death: { c: '300,000원', m: '300,000원', l: '3일', f: '-' }, aunt_uncle_death: { c: '-', m: '200,000원', l: '-', f: '-' }, grandparent_death: { c: '300,000원', m: '300,000원', l: '3일', f: '지원' }, sibling_marriage: { c: '100,000원', m: '200,000원', l: '1일', f: '-' }, my_marriage: { c: '500,000원', m: '700,000원', l: '7일', f: '지원' } };
        window.calculateCondolence = () => { const v = document.getElementById('eventSelect').value; const res = document.getElementById('calcResult'); if(!v) return res.classList.add('hidden'); document.getElementById('r_company').innerText = rules[v].c; document.getElementById('r_mutual').innerText = rules[v].m; document.getElementById('r_leave').innerText = rules[v].l; document.getElementById('r_flower').innerText = rules[v].f; res.classList.remove('hidden'); };

        // [업체 관리 모달 및 렌더링]
        db.collection("vendors").onSnapshot(snap => {
            let html = ''; 
            vendorDataCache = {};
            snap.forEach(doc => { 
                const v = doc.data(); 
                vendorDataCache[doc.id] = v;
                
                let btnSms = v.useSms ? `<button onclick="event.stopPropagation(); sendSMS('${doc.id}')" class="w-7 h-7 flex items-center justify-center bg-green-50 text-green-600 rounded-md border border-green-100 hover:bg-green-100"><i class="fa-solid fa-comment-sms text-[10px]"></i></button>` : '';
                let btnCall = v.useCall ? `<a href="tel:${v.tel}" onclick="event.stopPropagation();" class="w-7 h-7 flex items-center justify-center bg-blue-100 text-blue-600 rounded-md"><i class="fa-solid fa-phone text-[10px]"></i></a>` : '';

                html += `<div onclick="openVendorModal('${doc.id}')" class="cursor-pointer flex justify-between items-center p-2.5 bg-white border border-slate-200 rounded-lg shadow-sm hover:border-blue-300 transition-colors mb-2">
                    <div>
                        <p class="font-bold text-[11px] text-slate-800">${v.name} <span class="text-[9px] font-normal text-slate-400 ml-1">${v.desc || ''}</span></p>
                        <p class="text-[10px] text-slate-500 font-mono mt-0.5">${v.tel}</p>
                    </div>
                    <div class="flex gap-1.5">
                        ${btnSms}
                        ${btnCall}
                    </div>
                </div>`; 
            });
            const emptyHtml = '<p class="text-[10px] text-slate-400 italic">등록된 업체가 없습니다.</p>';
            if(document.getElementById('vendorList_home')) document.getElementById('vendorList_home').innerHTML = html || emptyHtml;
            if(document.getElementById('vendorList_detail')) document.getElementById('vendorList_detail').innerHTML = html || emptyHtml;
        });

        window.openVendorModal = (id = null) => {
            document.getElementById('v_id').value = id || '';
            if (id && vendorDataCache[id]) {
                const v = vendorDataCache[id];
                document.getElementById('vendorModalTitle').innerText = "업체 정보 수정";
                document.getElementById('v_name').value = v.name || '';
                document.getElementById('v_tel').value = v.tel || '';
                document.getElementById('v_desc').value = v.desc || '';
                document.getElementById('v_use_call').checked = v.useCall !== false; 
                document.getElementById('v_use_sms').checked = v.useSms || false;
                document.getElementById('v_sms_template').value = v.smsTemplate || '';
                document.getElementById('btn_delete_vendor').classList.remove('hidden');
            } else {
                document.getElementById('vendorModalTitle').innerText = "새 업체 등록";
                document.getElementById('v_name').value = '';
                document.getElementById('v_tel').value = '';
                document.getElementById('v_desc').value = '';
                document.getElementById('v_use_call').checked = true; 
                document.getElementById('v_use_sms').checked = false; 
                document.getElementById('v_sms_template').value = '';
                document.getElementById('btn_delete_vendor').classList.add('hidden');
            }
            toggleSmsArea();
            document.getElementById('vendorModal').classList.remove('hidden');
        };

        window.toggleSmsArea = () => {
            const isChecked = document.getElementById('v_use_sms').checked;
            document.getElementById('smsTemplateArea').style.display = isChecked ? 'block' : 'none';
        };

        window.saveVendor = () => {
            const id = document.getElementById('v_id').value;
            const data = {
                name: document.getElementById('v_name').value,
                tel: document.getElementById('v_tel').value,
                desc: document.getElementById('v_desc').value,
                useCall: document.getElementById('v_use_call').checked,
                useSms: document.getElementById('v_use_sms').checked,
                smsTemplate: document.getElementById('v_sms_template').value
            };
            if(!data.name || !data.tel) return alert('업체명과 전화번호는 필수입니다.');

            if (id) db.collection("vendors").doc(id).update(data);
            else db.collection("vendors").add(data);
            
            closeModal('vendorModal');
        };

        window.deleteVendor = () => {
            const id = document.getElementById('v_id').value;
            if(confirm("이 업체를 삭제하시겠습니까?")) {
                db.collection("vendors").doc(id).delete();
                closeModal('vendorModal');
            }
        };

        window.sendSMS = (vendorId) => {
            const v = vendorDataCache[vendorId];
            if (!v) return;

            let title = currentEventId ? document.getElementById('d_title').innerText : '';
            let info = currentEventId ? document.getElementById('d_info').innerText : '';
            
            let time = '', loc = '';
            if(info) {
                let parts = info.split('|');
                time = parts[0] ? parts[0].trim() : '';
                loc = parts[1] ? parts[1].trim() : '';
            }

            let bodyText = "";

            if (v.name.includes('위드고')) {
                bodyText = `<위드고 1800-9222> 화환 발송\n\n배송일 : ${time}\n*종류(금액)&수량 : \n*배송지 : ${loc}\n*보내는이(왼쪽문구) : \n*배송문구(오른쪽문구) : \n*받는이 : \n*주문자 : `;
            } else if (v.name.includes('우영') || v.name.includes('상조용품')) {
                bodyText = `<우영프라자 1668-5487> 상조용품 발송\n\n회사명 : 유니테스트\n받는분 성함 : \n연락처 : \n장례식장/호실/고인명 : ${loc} / ${title}\n품목 및 수량 : \n비고 : `;
            } else if (v.name.includes('범아') || v.name.includes('관광') || v.name.includes('버스')) {
                bodyText = `범아관광\n업체명 : 유니테스트\n출발지 : \n출발시간 : ${time}\n도착지 주소 : ${loc}`;
            } else {
                if(v.smsTemplate) {
                    bodyText = v.smsTemplate.replace(/\[행사명\]/g, title).replace(/\[일시\]/g, time).replace(/\[장소\]/g, loc);
                } else {
                    bodyText = `[발송 요청]\n행사명: ${title}\n일시: ${time}\n장소: ${loc}`;
                }
            }

            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const sep = isIOS ? '&' : '?';
            window.location.href = `sms:${v.tel}${sep}body=${encodeURIComponent(bodyText)}`;
        };

        loadLists();
    </script>
</body>
</html>
