<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>유니테스트 주말 비상 관제보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen overflow-x-hidden pb-24">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto w-full px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-extrabold text-blue-700 flex items-center">
                <i class="fa-solid fa-shield-halved mr-2"></i>주말 비상상황 통합 관제
            </h1>
            <span class="text-xs font-bold bg-blue-100 text-blue-800 px-2 py-1 rounded-full">경영지원팀</span>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full p-4 space-y-6">

        <section class="bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl p-5 shadow-lg text-white">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-lg"><i class="fa-solid fa-chart-pie mr-2"></i>전체 진행 상황</h2>
                <span id="globalPercent" class="text-2xl font-black">0%</span>
            </div>
            
            <div class="w-full bg-blue-900/50 h-3 rounded-full overflow-hidden mb-4">
                <div id="globalProgressBar" class="bg-white h-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <div class="grid grid-cols-4 gap-2 text-center text-xs" id="memberProgress">
                </div>
        </section>

        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <h2 class="font-bold text-slate-700 mb-3 flex items-center">
                <i class="fa-solid fa-calculator text-blue-500 mr-2"></i>경조금 & 지원내역 계산기
            </h2>
            <select id="eventSelect" onchange="calculateCondolence()" class="w-full bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 mb-3">
                <option value="">경조사 종류를 선택하세요</option>
                <option value="parent_death">부모님 상 (빙부/빙모 포함)</option>
                <option value="sibling_death">형제자매 상 (본인/배우자)</option>
                <option value="aunt_uncle_death">고모/삼촌 등 부모님 형제자매 상</option>
                <option value="grandparent_death">조부모 상 (외조부모, 빙조부모 포함)</option>
                <option value="sibling_marriage">형제자매 결혼 (본인/배우자)</option>
                <option value="my_marriage">본인 결혼</option>
            </select>
            <div id="calcResult" class="hidden bg-blue-50 p-3 rounded-xl border border-blue-100 text-sm">
                <div class="flex justify-between mb-1"><span class="text-slate-500">회사 경조금</span><span id="r_company" class="font-bold text-blue-700"></span></div>
                <div class="flex justify-between mb-1"><span class="text-slate-500">사우회비</span><span id="r_mutual" class="font-bold text-blue-700"></span></div>
                <div class="flex justify-between mb-1"><span class="text-slate-500">지원 휴가</span><span id="r_leave" class="font-bold text-slate-700"></span></div>
                <div class="flex justify-between"><span class="text-slate-500">화환/조화</span><span id="r_flower" class="font-bold text-slate-700"></span></div>
            </div>
        </section>

        <section>
            <h2 class="font-bold text-slate-700 mb-3 flex items-center px-1">
                <i class="fa-solid fa-list-check text-blue-500 mr-2"></i>담당자별 상세 업무
            </h2>
            <div id="ownerCardsArea" class="space-y-4">
                </div>
        </section>

        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-slate-700 flex items-center">
                    <i class="fa-solid fa-phone-volume text-blue-500 mr-2"></i>긴급 협력업체
                </h2>
                <button onclick="addVendor()" class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded font-bold hover:bg-blue-200">+ 추가</button>
            </div>
            <div id="vendorList" class="space-y-3">
                </div>
        </section>

    </main>

    <script>
        // ★ 본인의 Firebase Config 로 덮어쓰세요
        const firebaseConfig = {
            apiKey: "AIzaSyBqu8g0wPkRDG4zrNz/CDSrZZjbuSWlkc4",
            authDomain: "msd-weekend.firebaseapp.com",
            projectId: "msd-weekend",
            storageBucket: "msd-weekend.firebasestorage.app",
            messagingSenderId: "167933737161",
            appId: "1:167933737161:web:3df42c755f658e19323518"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // [경조금 계산기 로직]
        const rules = {
            parent_death: { c: '500,000원 (배우자부모 300,000원)', m: '500,000원', l: '7일 (배우자부모 5일)', f: '지원 (화환 O)' },
            sibling_death: { c: '300,000원', m: '300,000원', l: '3일', f: '미지원' },
            aunt_uncle_death: { c: '지급 대상 아님', m: '200,000원', l: '휴가 없음', f: '미지원' },
            grandparent_death: { c: '300,000원', m: '300,000원', l: '3일', f: '지원 (화환 O)' },
            sibling_marriage: { c: '100,000원', m: '200,000원', l: '1일', f: '미지원' },
            my_marriage: { c: '500,000원', m: '700,000원', l: '7일', f: '지원 (화환 O)' }
        };

        window.calculateCondolence = () => {
            const val = document.getElementById('eventSelect').value;
            const resBox = document.getElementById('calcResult');
            if(!val) { resBox.classList.add('hidden'); return; }
            document.getElementById('r_company').innerText = rules[val].c;
            document.getElementById('r_mutual').innerText = rules[val].m;
            document.getElementById('r_leave').innerText = rules[val].l;
            document.getElementById('r_flower').innerText = rules[val].f;
            resBox.classList.remove('hidden');
        };

        // ----------------------------------------------------
        // [업무 및 개인 데이터 연동 로직]
        // ----------------------------------------------------
        const owners = ['조정열', '안정훈/변우혁', '김태석', '박유희'];
        
        // 1. 처음 실행 시 DB에 데이터가 없으면 세분화된 기본값 세팅
        const initDefaults = () => {
            const defaultTasks = [
                { owner: '조정열', title: '경영지원 단톡방에 지원조건 (휴가,조화,금액) 공유', done: false },
                { owner: '안정훈/변우혁', title: '사우회비 대상자 또는 참석자에게 직접 전달 및 확인', done: false },
                { owner: '안정훈/변우혁', title: '월요일 지출결의서 상신 준비 (최종 금액 확인)', done: false },
                { owner: '김태석', title: '휴일 비상연락망(카톡) 가동 및 상세 내용 전파', done: false },
                { owner: '김태석', title: '유니넷 경조사게시판 게시 (어려울 시 당일 팀원에게 요청)', done: false },
                { owner: '김태석', title: '대상자에게 대절버스 필요 여부 확인 (규정상 가능 시)', done: false },
                { owner: '김태석', title: '유니넷 게시판에 대절버스 신청/인원파악 글 게시 (필요시)', done: false },
                { owner: '박유희', title: '정확한 장소, 발인시간 확인 후 화환/조화 업체 발주', done: false }
            ];
            db.collection("tasks").get().then(snap => {
                if(snap.empty) {
                    defaultTasks.forEach((t, idx) => {
                        db.collection("tasks").add({ ...t, createdAt: Date.now() + idx });
                    });
                }
            });
        };
        initDefaults();

        let allTasks = [];
        let allUsersMeta = {}; // 대체자, 특이사항 저장

        // Firestore 실시간 리스너 (업무 & 유저정보)
        db.collection("tasks").orderBy("createdAt").onSnapshot(snap => {
            allTasks = [];
            snap.forEach(doc => allTasks.push({ id: doc.id, ...doc.data() }));
            renderAll();
        });

        db.collection("userMeta").onSnapshot(snap => {
            allUsersMeta = {};
            snap.forEach(doc => allUsersMeta[doc.id] = doc.data());
            renderAll();
        });

        // ----------------------------------------------------
        // [화면 그리기 (렌더링)]
        // ----------------------------------------------------
        function renderAll() {
            let totalTasks = 0;
            let completedTasks = 0;
            let mHtml = ''; // 대시보드 미니 진행률
            let cHtml = ''; // 개인별 카드

            owners.forEach(owner => {
                const myTasks = allTasks.filter(t => t.owner === owner);
                const myMeta = allUsersMeta[owner] || { sub: '', note: '' };
                
                let myTot = myTasks.length;
                let myDone = myTasks.filter(t => t.done).length;
                totalTasks += myTot;
                completedTasks += myDone;

                // [대시보드] 미니 진행률 생성
                const mKey = owner.includes('안정훈') ? '안/변' : owner;
                const isAllDone = (myTot > 0 && myTot === myDone);
                mHtml += `
                    <div class="bg-blue-800/50 rounded py-2">
                        <div class="font-bold ${isAllDone ? 'text-green-300' : 'text-blue-200'}">${mKey}</div>
                        <div class="text-white mt-1">${myDone} / ${myTot}</div>
                    </div>
                `;

                // [카드영역] 개인별 카드 생성
                const activeName = myMeta.sub ? `${owner} <span class="text-blue-500 font-bold ml-1">(${myMeta.sub} 대체)</span>` : owner;
                
                let taskListHtml = myTasks.map(t => `
                    <div class="flex items-start justify-between py-2 border-b border-slate-100 last:border-0 group">
                        <div class="flex items-start gap-3 cursor-pointer flex-grow" onclick="toggleTask('${t.id}', ${!t.done})">
                            <div class="mt-0.5 w-5 h-5 shrink-0 rounded border-2 flex items-center justify-center transition-colors ${t.done ? 'bg-green-500 border-green-500 text-white' : 'border-slate-300 text-transparent'}">
                                <i class="fa-solid fa-check text-[10px]"></i>
                            </div>
                            <span class="text-sm ${t.done ? 'line-through text-slate-400' : 'text-slate-700'}">${t.title}</span>
                        </div>
                        <button onclick="delTask('${t.id}')" class="ml-2 text-slate-300 hover:text-red-500 px-2 py-1"><i class="fa-solid fa-trash-can text-sm"></i></button>
                    </div>
                `).join('');

                if(myTasks.length === 0) taskListHtml = '<p class="text-xs text-slate-400 py-2">등록된 업무가 없습니다.</p>';

                cHtml += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-slate-800 text-sm">${activeName}</h3>
                            <button onclick="setSub('${owner}')" class="text-[10px] bg-white border border-slate-300 text-slate-600 px-2 py-1 rounded hover:bg-slate-100 shadow-sm">대체자 지정</button>
                        </div>
                        
                        <div class="p-4 pb-2">
                            ${taskListHtml}
                            <button onclick="addTask('${owner}')" class="mt-3 text-xs font-bold text-blue-500 flex items-center hover:text-blue-700">
                                <i class="fa-solid fa-plus mr-1"></i> ${owner.includes('안정훈') ? '안/변' : owner} 업무 추가
                            </button>
                        </div>

                        <div class="bg-yellow-50/50 p-3 border-t border-slate-100 flex gap-2">
                            <input type="text" id="note_${owner}" value="${myMeta.note || ''}" placeholder="해당 담당자의 진행 특이사항을 적어주세요..." class="text-xs w-full bg-white border border-yellow-200 rounded px-3 py-2 focus:outline-none focus:border-yellow-400 text-slate-700">
                            <button onclick="saveNote('${owner}')" class="text-xs bg-yellow-400 text-yellow-900 font-bold px-3 rounded whitespace-nowrap hover:bg-yellow-500 shadow-sm">저장</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('memberProgress').innerHTML = mHtml;
            document.getElementById('ownerCardsArea').innerHTML = cHtml;

            const percent = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
            document.getElementById('globalPercent').innerText = percent + '%';
            document.getElementById('globalProgressBar').style.width = percent + '%';
        }

        // ----------------------------------------------------
        // [업무 컨트롤 버튼 액션]
        // ----------------------------------------------------
        window.toggleTask = (id, status) => db.collection("tasks").doc(id).update({ done: status });
        
        window.addTask = (owner) => {
            const title = prompt(`${owner} 프로님의 새 업무를 입력하세요.`);
            if(title) db.collection("tasks").add({ owner, title, done: false, createdAt: Date.now() });
        };
        
        window.delTask = (id) => {
            if(confirm("이 업무를 삭제하시겠습니까?")) db.collection("tasks").doc(id).delete();
        };

        window.setSub = (owner) => {
            const subName = prompt(`${owner} 담당자의 업무를 인수인계 받을 대체자 이름을 적어주세요.\n(비워두면 원래대로 복구됩니다)`);
            if(subName !== null) db.collection("userMeta").doc(owner).set({ sub: subName }, { merge: true });
        };

        window.saveNote = (owner) => {
            const noteVal = document.getElementById(`note_${owner}`).value;
            db.collection("userMeta").doc(owner).set({ note: noteVal }, { merge: true });
            alert(`${owner.includes('안정훈') ? '안/변' : owner} 담당 파트의 특이사항이 저장되었습니다.`);
        };

        // ----------------------------------------------------
        // [긴급 업체 연락처 액션]
        // ----------------------------------------------------
        db.collection("vendors").onSnapshot(snap => {
            let html = '';
            snap.forEach(doc => {
                const v = doc.data();
                html += `
                    <div class="flex justify-between items-center p-3 bg-slate-50 border border-slate-200 rounded-xl">
                        <div>
                            <p class="font-bold text-sm text-slate-800">${v.name}</p>
                            <p class="text-xs text-slate-500">${v.desc || '비고 없음'}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <a href="tel:${v.tel}" class="w-8 h-8 flex items-center justify-center bg-blue-100 text-blue-600 rounded-full hover:bg-blue-200"><i class="fa-solid fa-phone"></i></a>
                            <button onclick="delVendor('${doc.id}')" class="w-8 h-8 flex items-center justify-center bg-red-50 text-red-500 rounded-full hover:bg-red-100"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('vendorList').innerHTML = html || '<p class="text-xs text-slate-400">등록된 업체가 없습니다.</p>';
        });

        window.addVendor = () => {
            const name = prompt("업체명 (예: 삼천리 화환)"); if(!name) return;
            const tel = prompt("전화번호 (예: 010-1234-5678)"); if(!tel) return;
            const desc = prompt("비고 (예: 담당자 박부장)");
            db.collection("vendors").add({ name, tel, desc });
        };

        window.delVendor = (id) => {
            if(confirm("정말 이 업체를 삭제하시겠습니까?")) db.collection("vendors").doc(id).delete();
        };
    </script>
</body>
</html>
